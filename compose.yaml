services:
  db:
    image: postgres:16-alpine
    container_name: finmate_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: finmate_db
    ports:
      - "5432:5432"
    volumes:
      - finmate_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d finmate_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finmate_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=FinMate
      - APP_ENV=production
      - APP_VERSION=0.1.0
      - DEBUG=False
      - SECRET_KEY=production-secure-finmate-key-must-be-rotated-32char
      - DATABASE_URL=postgresql+psycopg://postgres:postgrespassword@db:5432/finmate_db
      - CORS_ORIGINS=["http://localhost:5173","http://localhost:3000"]
      - LOG_LEVEL=INFO
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: finmate_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  finmate_pgdata:
    driver: local
